name: Native CLI and Packaging CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          toolchain: "1.89.0"

      - name: Rust formatting and lints
        run: |
          cargo fmt --check --manifest-path native/Cargo.toml
          cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path native/Cargo.toml --all-targets --features test-hooks -- -D warnings

      - name: MSRV 1.89.0 locked release binaries and tests
        run: |
          cargo +1.89.0 build --manifest-path native/Cargo.toml --locked --release --bins
          cargo +1.89.0 test --manifest-path native/Cargo.toml --locked

      - name: Packaging unit tests
        run: npm test --prefix cli
