[package]
name = "clec"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fst = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = { version = "0.25", default-features = false, features = ["mmap", "zstd-compression"] }
tar = { version = "0.4", default-features = false }
tempfile = "3"
time = "0.3"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
unicode-script = "0.5"
unicode-segmentation = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zhconv = { version = "0.4.2", default-features = false, features = ["opencc", "compress"] }
zstd = { version = "0.13", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[build-dependencies]
fst = "0.4"

[profile.release]
strip = true
