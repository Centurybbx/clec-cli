name: CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Install and exercise packed executable
        shell: bash
        run: |
          npm pack --ignore-scripts
          npm install --global ./*.tgz
          clec --version
          clec status --format json
          clec search --help
