[package]
name = "clec-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
description = "Offline CLEC evidence search, exact byte-span reads, and local snapshot sync"

[lib]
name = "clec_core"
path = "src/lib.rs"

[features]
default = []
test-hooks = []

[[example]]
name = "clec_test_fixture"
path = "examples/clec_test_fixture.rs"
required-features = ["test-hooks"]

[[bin]]
name = "clec"
path = "src/bin/clec.rs"

[[bin]]
name = "clec-publish"
path = "src/bin/clec-publish.rs"

[[bin]]
name = "clec-validate"
path = "src/bin/clec-validate.rs"

[dependencies]
clap = { version = "4.6.8", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ferrous-opencc = "0.4.0"
jieba-rs = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0"
unicode-normalization = "0.1.26"
zstd = "0.14.4"

[dev-dependencies]
tempfile = "3"
