[project]
name = "clec-knowledge"
version = "0.1.0"
description = "Local, source-grounded CLEC knowledge retrieval"
requires-python = ">=3.10"
dependencies = ["opencc-python-reimplemented==0.1.7"]

[project.scripts]
clec = "clec_kb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clec_kb*"]
